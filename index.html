<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello from Vercel</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  h1 {
    font-size: 3rem;
    margin-bottom: 0.5rem;
  }
  p {
    color: #a1a1a1;
    font-size: 1.1rem;
  }
  #supabase-status {
    margin-top: 1.5rem;
    padding: 0.75rem 1.25rem;
    border-radius: 8px;
    background: #151515;
    border: 1px solid #262626;
    font-size: 0.95rem;
    color: #6ee7a5;
  }
  #supabase-status.error {
    color: #f28b82;
  }
</style>
</head>
<body>
  <div>
    <h1>Hello 👋</h1>
    <p>If you can see this, your GitHub repo is connected to Vercel.</p>
    <div id="supabase-status">Checking Supabase connection…</div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://kzoxttrsefspxzhpkgwz.supabase.co";
    const supabaseKey = "sb_publishable_guQX_dW6-jir40myg94W-A_uzJeb7gU";
    const supabase = createClient(supabaseUrl, supabaseKey);

    const statusEl = document.getElementById("supabase-status");

    const { data, error } = await supabase
      .from("connection_test")
      .select("message")
      .limit(1)
      .single();

    if (error) {
      statusEl.textContent = `Supabase connection failed: ${error.message}`;
      statusEl.classList.add("error");
    } else {
      statusEl.textContent = data.message;
    }
  </script>
</body>
</html>
