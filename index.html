<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello from Vercel</title>
<style>
  html, body {
    min-height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 2rem 1rem;
  }
  h1 {
    font-size: 3rem;
    margin-bottom: 0.5rem;
  }
  p {
    color: #a1a1a1;
    font-size: 1.1rem;
  }
  #supabase-status {
    margin-top: 1.5rem;
    padding: 0.75rem 1.25rem;
    border-radius: 8px;
    background: #151515;
    border: 1px solid #262626;
    font-size: 0.95rem;
    color: #6ee7a5;
  }
  #supabase-status.error {
    color: #f28b82;
  }
  #deal-card {
    margin-top: 1.5rem;
    padding: 1.25rem 1.5rem;
    border-radius: 8px;
    background: #151515;
    border: 1px solid #262626;
    text-align: left;
    font-size: 0.95rem;
    min-width: 280px;
  }
  #deal-card h2 {
    margin: 0 0 0.75rem;
    font-size: 1.2rem;
    color: #f5f5f5;
    text-align: center;
  }
  #deal-card dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.35rem 1rem;
  }
  #deal-card dt {
    color: #a1a1a1;
  }
  #deal-card dd {
    margin: 0;
    text-align: right;
    color: #f5f5f5;
  }
  #deal-card.error {
    color: #f28b82;
    text-align: center;
  }
</style>
</head>
<body>
  <div>
    <h1>Hello 👋</h1>
    <p>If you can see this, your GitHub repo is connected to Vercel.</p>
    <div id="supabase-status">Checking Supabase connection…</div>
    <div id="deal-card">Loading deal info…</div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://kzoxttrsefspxzhpkgwz.supabase.co";
    const supabaseKey = "sb_publishable_guQX_dW6-jir40myg94W-A_uzJeb7gU";
    const supabase = createClient(supabaseUrl, supabaseKey);

    const statusEl = document.getElementById("supabase-status");
    const dealEl = document.getElementById("deal-card");

    const { data, error } = await supabase
      .from("connection_test")
      .select("message")
      .limit(1)
      .single();

    if (error) {
      statusEl.textContent = `Supabase connection failed: ${error.message}`;
      statusEl.classList.add("error");
    } else {
      statusEl.textContent = data.message;
    }

    const currency = (n) =>
      n == null ? "—" : `$${Number(n).toLocaleString()}`;

    try {
      const res = await fetch(
        `${supabaseUrl}/functions/v1/get-deal-demo`,
        { headers: { Authorization: `Bearer ${supabaseKey}`, apikey: supabaseKey } },
      );
      const deal = await res.json();

      if (!res.ok) throw new Error(deal.error || "Request failed");

      dealEl.innerHTML = `
        <h2>${deal.name}</h2>
        <dl>
          <dt>Address</dt><dd>${deal.property_address}, ${deal.property_city}, ${deal.property_state}</dd>
          <dt>Type</dt><dd>${deal.property_type}</dd>
          <dt>Year Built</dt><dd>${deal.year_built}</dd>
          <dt>Building Size</dt><dd>${Number(deal.building_size_sf).toLocaleString()} SF</dd>
          <dt>Occupancy</dt><dd>${deal.occupancy_pct}%</dd>
          <dt>Market Cap Rate</dt><dd>${(deal.market_cap_rate * 100).toFixed(2)}%</dd>
          <dt>Current NOI</dt><dd>${currency(deal.noi_current)}</dd>
          <dt>Asking Price</dt><dd>${currency(deal.asking_price)}</dd>
          <dt>Stage</dt><dd>${deal.deal_stage}</dd>
        </dl>
      `;
    } catch (err) {
      dealEl.textContent = `Failed to load deal: ${err.message}`;
      dealEl.classList.add("error");
    }
  </script>
</body>
</html>
